packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - "@vitest/coverage-v8@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - jsdom@30.1.3
  - vitest@5.0.5
  - "@better-auth/core@1.7.10"
  - "@better-auth/drizzle-adapter@1.7.10"
  - "@better-auth/kysely-adapter@1.7.10"
  - "@better-auth/memory-adapter@1.7.10"
  - "@better-auth/mongo-adapter@1.7.10"
  - "@better-auth/prisma-adapter@1.7.10"
  - "@better-auth/telemetry@1.7.10"
  - better-auth@1.7.10
  - miniflare@5.20261019.2-beta
  - wrangler@4.152.0

# Keep route generation on the repository's formatter, including upstream internals.
overrides:
  # Vite plugin 1.64.0's Miniflare needs the newer workerd patch for local preview.
  "miniflare@5.20261012.0-beta>workerd": 1.20261019.1
  "@codemirror/view": 6.43.14
  # Legacy Wiki state conversion must use one ProseMirror model identity.
  prosemirror-model: 1.25.12
  "@tanstack/router-generator@1.167.44>prettier": "-"

packageExtensions:
  "@tanstack/router-generator@1.167.44":
    dependencies:
      oxfmt: 0.73.0

patchedDependencies:
  "@tanstack/router-generator@1.167.44": patches/@tanstack__router-generator@1.167.44.patch
