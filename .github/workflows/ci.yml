name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lumolynk
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: lumolynk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumolynk -d lumolynk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lumolynk:ci-test-password@localhost:5432/lumolynk_test
      BETTER_AUTH_SECRET: ci-only-test-secret-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:all
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm desktop:package
      - run: xvfb-run -a pnpm test:desktop
        env:
          LUMOLYNK_PACKAGED_DESKTOP: apps/desktop/release/linux-unpacked/lumolynk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ runner.os }}
          path: coverage/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm boundaries
      - run: pnpm deps:check
      - run: pnpm deps:unused
      - run: pnpm check-types
      - run: pnpm test --project web --project contracts --project env --project auth --project shared --project api-client --project desktop
      - run: pnpm build
